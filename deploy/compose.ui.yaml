# Server, database and the static UI under one origin (http://localhost:${I3CM_UI_PORT:-8090}).
#   docker compose -f deploy/compose.ui.yaml -p i3cm-ui up --build -d
#   docker compose -f deploy/compose.ui.yaml -p i3cm-ui exec server i3cm-server init-tenant demo
# Demo data: python3 deploy/ui/seed-demo.py http://localhost:8090 <token>
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: i3cm
      POSTGRES_DB: i3cm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      I3CM_DATABASE_URL: postgresql://postgres:i3cm@db:5432/i3cm
    # installed modules are state: they survive a new container only on a volume
    volumes: [modules:/var/lib/i3cm/modules]
    restart: unless-stopped
    init: true
    depends_on:
      db: { condition: service_healthy }
  web:
    image: nginx:1.27-alpine
    volumes:
      - ../ui:/usr/share/nginx/html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${I3CM_UI_PORT:-8090}:80"]
    depends_on: [server]
volumes:
  pgdata: {}
  modules: {}
