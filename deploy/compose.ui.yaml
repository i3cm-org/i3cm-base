# Server, database and the static UI under one origin (http://localhost:${BASE_UI_PORT:-8090}).
#   docker compose -f deploy/compose.ui.yaml -p base-erp-ui up --build -d
#   docker compose -f deploy/compose.ui.yaml -p base-erp-ui exec server base-server init-tenant demo
# Demo data: python3 deploy/ui/seed-demo.py http://localhost:8090 <token>
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: base
      POSTGRES_DB: base
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      BASE_DATABASE_URL: postgresql://postgres:base@db:5432/base
    depends_on:
      db: { condition: service_healthy }
  web:
    image: nginx:1.27-alpine
    volumes:
      - ../ui:/usr/share/nginx/html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${BASE_UI_PORT:-8090}:80"]
    depends_on: [server]
volumes:
  pgdata: {}
