<template data-aspect="filing" data-type="dms:Document">
  <div class="dms-document">
    <div><span data-label="date"></span>: <span data-attr="date"></span></div>
    <div><span data-label="sender"></span>: <span data-attr="sender"></span></div>
  </div>
</template>
<template data-aspect="senders" data-type="dms:Document">
  <div class="dms-document">
    <div><span data-label="date"></span>: <span data-attr="date"></span></div>
    <div><span data-label="sender"></span>: <span data-attr="sender"></span></div>
  </div>
</template>
<template data-aspect="inbox" data-type="dms:Document">
  <div class="dms-document">
    <div><span data-label="sender"></span>: <span data-attr="sender"></span></div>
  </div>
</template>
<template data-aspect="binders" data-type="dms:Binder">
  <div class="dms-binder">
    <div><span data-label="documentCount"></span>: <span data-attr="documentCount"></span></div>
  </div>
</template>
