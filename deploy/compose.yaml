# docker compose -f deploy/compose.yaml up --build
# then: docker compose -f deploy/compose.yaml exec server base-server init-tenant demo
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: base
      POSTGRES_DB: base
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      BASE_DATABASE_URL: postgresql://postgres:base@db:5432/base
    ports: ["8480:8480"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata: {}
