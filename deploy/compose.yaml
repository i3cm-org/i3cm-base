# docker compose -f deploy/compose.yaml up --build
# then: docker compose -f deploy/compose.yaml exec server i3cm-server init-tenant demo
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: i3cm
      POSTGRES_DB: i3cm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
    restart: unless-stopped
  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      I3CM_DATABASE_URL: postgresql://postgres:i3cm@db:5432/i3cm
    # installed modules and the file store (contents, uploads) are state: they survive a new
    # container only on volumes
    volumes: [modules:/var/lib/i3cm/modules, data:/var/lib/i3cm/data]
    restart: unless-stopped
    init: true
    ports: ["8480:8480"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata: {}
  modules: {}
  data: {}
