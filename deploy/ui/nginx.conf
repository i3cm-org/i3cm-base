# One origin for the static UI and the API: files from /usr/share/nginx/html, /v1 and /health
# passed to the server unchanged. No rewrite rules: the UI keeps its state in the fragment.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 200m;

    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location = /config.json { add_header Cache-Control "no-cache"; }
    location /vendor/ { add_header Cache-Control "public, max-age=86400"; }
    location ~ \.mjs$ { default_type text/javascript; }

    # uploads stream through: parts of up to 64 MiB, no buffering of request bodies
    location /v1/ { proxy_pass http://server:8480; proxy_set_header Host $host; proxy_buffering off; proxy_request_buffering off; }
    location = /health { proxy_pass http://server:8480; }
}
