[package]
name = "i3cm-wasm"
description = "WebAssembly component runtime for i3cm modules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
i3cm-core = { version = "0.8.3", path = "../i3cm-core" }
i3cm-store = { version = "0.8.3", path = "../i3cm-store" }
wasmtime = "51"
wasmtime-wasi = "51"
tokio = { version = "1.54.1", features = ["full"] }
serde_json = "1.0.154"
tokio-postgres = "0.7.18"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
tracing = "0.1.44"
