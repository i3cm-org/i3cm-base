[package]
name = "i3cm-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
i3cm-core = { version = "0.8.4", path = "../i3cm-core" }
i3cm-store = { version = "0.8.4", path = "../i3cm-store" }
i3cm-tools = { version = "0.8.4", path = "../i3cm-tools" }
i3cm-wasm = { version = "0.8.4", path = "../i3cm-wasm" }
base64 = "0.22.1"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
rust_xlsxwriter = "=0.102.0"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
