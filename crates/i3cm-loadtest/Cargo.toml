[package]
name = "i3cm-loadtest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.105"
i3cm-client = { version = "0.8.4", path = "../i3cm-client" }
i3cm-server = { version = "0.8.4", path = "../i3cm-server" }
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
futures = "0.3.34"
rand = "0.10.4"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
