[package]
name = "base-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
base-core = { version = "0.4.0", path = "../base-core" }
base-store = { version = "0.4.0", path = "../base-store" }
base-tools = { version = "0.4.0", path = "../base-tools" }
base64 = "0.22.1"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
rust_xlsxwriter = "=0.102.0"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
