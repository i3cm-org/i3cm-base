[package]
name = "base-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
base-api = { version = "0.4.0", path = "../base-api" }
base-core = { version = "0.4.0", path = "../base-core" }
base-store = { version = "0.4.0", path = "../base-store" }
clap = { version = "4.6.9", features = ["derive", "env"] }
postgresql_embedded = { version = "0.22.0", features = ["tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
base-client = { path = "../base-client" }
chrono = "0.4.45"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
