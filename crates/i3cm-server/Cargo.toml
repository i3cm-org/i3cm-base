[package]
name = "i3cm-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
i3cm-api = { version = "0.5.0", path = "../i3cm-api" }
i3cm-core = { version = "0.5.0", path = "../i3cm-core" }
i3cm-store = { version = "0.5.0", path = "../i3cm-store" }
clap = { version = "4.6.9", features = ["derive", "env"] }
postgresql_embedded = { version = "0.22.0", features = ["tokio"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
i3cm-client = { path = "../i3cm-client" }
chrono = "0.4.45"
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
tokio = { version = "1.54.1", features = ["full"] }
