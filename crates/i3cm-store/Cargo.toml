[package]
name = "i3cm-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
i3cm-core = { version = "0.9.0-a", path = "../i3cm-core" }
i3cm-tools = { version = "0.9.0-a", path = "../i3cm-tools" }
chrono = { version = "0.4.45", features = ["serde"] }
deadpool-postgres = "0.14.2"
base64 = "0.22.1"
bytes = "1.12.2"
futures-core = "0.3.34"
futures-util = "0.3.34"
hex = "0.4.3"
rust_decimal = { version = "1.43.0", features = ["db-tokio-postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tracing = "0.1.44"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
