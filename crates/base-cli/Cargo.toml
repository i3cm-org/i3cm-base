[package]
name = "base-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The base program: FUSE driver (read-only), the Unix tools on the data, base-init"

[[bin]]
name = "base"
path = "src/main.rs"

[dependencies]
base-tools = { version = "0.4.0", path = "../base-tools" }
base64 = "0.22.1"
fuser = { version = "0.19.0", default-features = false }
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"

[dev-dependencies]
base-client = { path = "../base-client" }
base-server = { path = "../base-server" }
base-store = { path = "../base-store" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
