<!doctype html>
<!-- Templates of the module "base" (DEC-127). Loaded by the frame (index.html); contains only
     <template> elements, no code and no data. The frame fills `data-attr` (attribute of the node
     by its key in the aspect), `data-label` (its display label) and `data-field` (a field of the
     node) and relies on its own web components (base-list-view, base-grid-view). -->
<html lang="en">
<body>
<template data-aspect="base:mailbox" data-type="base:Mail">
  <dl class="card">
    <dt data-label="sender">Sender</dt><dd data-attr="sender"></dd>
    <dt data-label="subject">Subject</dt><dd data-attr="subject"></dd>
    <dt data-label="received">Received</dt><dd data-attr="received"></dd>
    <dt data-label="attachmentCount">Attachments</dt><dd data-attr="attachmentCount"></dd>
  </dl>
</template>
<template data-aspect="base:recipients" data-type="base:Mail">
  <dl class="card">
    <dt data-label="sender">Sender</dt><dd data-attr="sender"></dd>
    <dt data-label="subject">Subject</dt><dd data-attr="subject"></dd>
  </dl>
</template>
</body>
</html>
